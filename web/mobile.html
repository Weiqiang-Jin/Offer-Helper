<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>offer helper · 手机显示</title><link rel="stylesheet" href="/style.css"></head><body class="phone-view"><header><div class="brand"><strong>offer helper</strong></div><span id="status" class="badge">正在配对</span></header><main><p id="message" role="status">手机仅显示电脑端的问题与回答，不使用麦克风。</p><div class="toolbar"><button id="retry">重新连接</button><button id="disconnect" class="quiet">退出配对</button></div><section class="card"><h2>面试官正在问</h2><p id="question" class="phone-question">等待电脑同步…</p></section><section class="card answer-card"><div class="section-heading"><h2>参考回答</h2><span id="progress" class="badge">等待</span></div><p id="answerFor" class="hint"></p><div id="answer" class="answer">等待生成建议回答。</div></section><p class="hint">保持电脑服务和问答页面开启；自动生成目前由电脑页面触发。手机休眠可能暂停同步，唤醒后自动恢复。</p></main><script src="/mobile.js"></script></body></html>
