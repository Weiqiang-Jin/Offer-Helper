<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">手机配对显示流程</title><desc id="desc">电脑开启配对并显示二维码，手机在同一可信局域网扫码后，只读显示当前问题和回答。</desc>
<rect width="1000" height="230" rx="22" fill="#f5f7ff"/><text x="38" y="45" font-size="24" font-weight="700" fill="#15234b" font-family="Microsoft YaHei, sans-serif">手机配对显示</text>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><rect x="40" y="76" width="230" height="100" rx="16" fill="#dce5ff"/><text x="155" y="117" font-size="18" fill="#142a65">电脑开启配对</text><text x="155" y="149" font-size="15" fill="#435780">生成二维码和证书指纹</text><text x="310" y="138" font-size="30" fill="#64749b">→</text><rect x="350" y="76" width="260" height="100" rx="16" fill="#cbd9ff"/><text x="480" y="117" font-size="18" fill="#142a65">手机扫码并核对</text><text x="480" y="149" font-size="15" fill="#435780">同一可信局域网</text><text x="650" y="138" font-size="30" fill="#64749b">→</text><rect x="690" y="76" width="270" height="100" rx="16" fill="#d7f3e9"/><text x="825" y="117" font-size="18" fill="#17694f">只读显示问题与回答</text><text x="825" y="149" font-size="15" fill="#17694f">模型与采集仍在电脑运行</text><text x="500" y="210" font-size="14" fill="#52617f">使用结束后，在电脑点击「撤销配对并关闭」</text></g></svg>
