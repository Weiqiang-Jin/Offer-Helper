<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">手动提问操作示意</title><desc id="desc">在当前问题输入框输入问题，按 Enter 或点击生成建议回答；Shift 加 Enter 换行，右侧逐步显示模型回答。</desc>
<rect width="1000" height="330" rx="22" fill="#f5f7ff"/>
<text x="38" y="45" font-size="24" font-weight="700" fill="#15234b" font-family="Microsoft YaHei, sans-serif">手动输入与生成</text>
<g font-family="Microsoft YaHei, sans-serif"><rect x="34" y="70" width="450" height="210" rx="18" fill="white" stroke="#cbd4ec"/><text x="58" y="104" font-size="19" font-weight="700" fill="#192b59">面试官正在问</text><rect x="58" y="120" width="402" height="80" rx="10" fill="#f3f6ff" stroke="#d8e0f2"/><text x="76" y="153" font-size="17" fill="#263659">请介绍一个你负责的项目。</text><rect x="58" y="218" width="170" height="44" rx="10" fill="#3d59d9"/><text x="75" y="246" font-size="17" font-weight="700" fill="white">生成建议回答 ↵</text><text x="251" y="245" font-size="14" fill="#52617f">Enter 生成 · Shift+Enter 换行</text>
<text x="502" y="183" font-size="30" fill="#64749b">→</text><rect x="545" y="70" width="421" height="210" rx="18" fill="white" stroke="#cbd4ec"/><text x="570" y="104" font-size="19" font-weight="700" fill="#192b59">参考回答</text><rect x="855" y="84" width="83" height="30" rx="15" fill="#d7f3e9"/><text x="874" y="105" font-size="14" fill="#17694f">生成中</text><text x="570" y="147" font-size="16" fill="#415070">模型会根据问题和个人材料</text><text x="570" y="176" font-size="16" fill="#415070">逐步显示建议回答……</text><text x="38" y="311" font-size="14" fill="#52617f">示意图：界面文字与布局可能随版本调整</text></g></svg>
